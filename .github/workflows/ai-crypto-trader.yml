name: AI Crypto Trader Entry Monitor

# Live alerts only on main ticks started by `schedule` or by the chain itself (github-actions[bot]); only that
# "Live scan" step reads TELEGRAM_TOKEN/TELEGRAM_CHAT_ID and it sends only on a confirmed NOW=ENTER setup.
# Manual workflow_dispatch runs, re-runs and other branches take the "Dry-run scan" step and never see secrets.
# Cadence: each tick is delayed by an Environment wait timer on its `wait` job (no runner is held while waiting),
# scans inside 08:00-22:00 Europe/Brussels and dispatches the next tick with the ephemeral GITHUB_TOKEN.
# After the last evening scan the next tick waits in an overnight environment until ~08:00.
# The crons below only seed or recover the chain. Cancelling a run stops the chain.
on:
  workflow_dispatch:
    inputs:
      wait_env:
        description: "Wait environment for this tick (set by the previous tick; empty = run now)"
        required: false
        default: ""
      not_before:
        description: "Earliest expected UTC start after the wait (set by the previous tick)"
        required: false
        default: ""
      ticks:
        description: "Remaining chained ticks on non-default branches (bounded proof runs)"
        required: false
        default: ""
  schedule:
    - cron: "52 5,6 * * *"
    - cron: "7 6-20 * * *"

permissions:
  contents: read

concurrency:
  # Isolated per ref: a proof chain on another branch can never cancel or delay a pending tick on main.
  group: ai-crypto-trader-entry-monitor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wait:
    if: inputs.wait_env != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    environment: ${{ inputs.wait_env }}
    permissions: {}

    steps:
      - name: Wait timer elapsed
        run: echo "Environment wait timer elapsed"

  monitor:
    needs: wait
    if: ${{ !cancelled() && (needs.wait.result == 'success' || needs.wait.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      chain: ${{ steps.cadence.outputs.chain }}
      next_wait_env: ${{ steps.cadence.outputs.next_wait_env }}
      next_not_before: ${{ steps.cadence.outputs.next_not_before }}
      next_ticks: ${{ steps.cadence.outputs.next_ticks }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Plan next tick and check Brussels scan window
        id: cadence
        env:
          WAIT_ENV: ${{ inputs.wait_env }}
          NOT_BEFORE: ${{ inputs.not_before }}
          TICKS: ${{ inputs.ticks }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: python scheduler/cadence.py --wait-env "$WAIT_ENV" --not-before "$NOT_BEFORE" --ticks "$TICKS" --default-branch "$DEFAULT_BRANCH" --ref-name "$GITHUB_REF_NAME"

      - name: Restore cumulative scan diagnostics
        id: diag-restore
        if: steps.cadence.outputs.active == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ai_crypto_monitor/state/scan-diagnostics.jsonl
          key: ai-crypto-diag-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ai-crypto-diag-v1-${{ github.ref_name }}-

      - name: Prepare scan diagnostics
        if: steps.cadence.outputs.active == 'true'
        env:
          MATCHED_CACHE_KEY: ${{ steps.diag-restore.outputs.cache-matched-key }}
          SCAN_DIAGNOSTICS_FILE: ${{ github.workspace }}/ai_crypto_monitor/state/scan-diagnostics.jsonl
          SCAN_DIAGNOSTICS_CURRENT: ${{ github.workspace }}/ai_crypto_monitor/state/current-scan-diagnostic.jsonl
          SCAN_DIAGNOSTICS_META: ${{ github.workspace }}/ai_crypto_monitor/state/scan-diagnostics-meta.json
        run: >-
          python -m ai_crypto_monitor.scan_diagnostics prepare
          --log "$SCAN_DIAGNOSTICS_FILE"
          --meta "$SCAN_DIAGNOSTICS_META"
          --current "$SCAN_DIAGNOSTICS_CURRENT"
          --matched-key "$MATCHED_CACHE_KEY"

      - name: Run tests
        id: tests
        if: steps.cadence.outputs.active == 'true'
        run: python -m unittest discover -s tests -v

      - name: Dry-run scan (OKX public candles, no Telegram, writes Step Summary)
        id: dry
        if: ${{ steps.cadence.outputs.active == 'true' && !(github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.triggering_actor == 'github-actions[bot]')) }}
        env:
          SCAN_DIAGNOSTICS_FILE: ${{ github.workspace }}/ai_crypto_monitor/state/scan-diagnostics.jsonl
          SCAN_DIAGNOSTICS_CURRENT: ${{ github.workspace }}/ai_crypto_monitor/state/current-scan-diagnostic.jsonl
          SCAN_DIAGNOSTICS_META: ${{ github.workspace }}/ai_crypto_monitor/state/scan-diagnostics-meta.json
          SCAN_DIAGNOSTICS_SYMBOL: BTC-USDT-SWAP
        run: python ai_crypto_monitor/entry_monitor.py scan --root "$GITHUB_WORKSPACE" --dry-run

      - name: Restore persistent dedup state
        if: ${{ steps.cadence.outputs.active == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.triggering_actor == 'github-actions[bot]') }}
        uses: actions/cache/restore@v4
        with:
          path: ai_crypto_monitor/state/dedup.json
          key: ai-crypto-dedup-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ai-crypto-dedup-${{ github.ref_name }}-

      - name: Live scan (OKX public candles, Telegram only on NOW=ENTER, writes Step Summary)
        id: live
        if: ${{ steps.cadence.outputs.active == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.triggering_actor == 'github-actions[bot]') }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_DIAGNOSTICS_FILE: ${{ github.workspace }}/ai_crypto_monitor/state/scan-diagnostics.jsonl
          SCAN_DIAGNOSTICS_CURRENT: ${{ github.workspace }}/ai_crypto_monitor/state/current-scan-diagnostic.jsonl
          SCAN_DIAGNOSTICS_META: ${{ github.workspace }}/ai_crypto_monitor/state/scan-diagnostics-meta.json
          SCAN_DIAGNOSTICS_SYMBOL: BTC-USDT-SWAP
        run: python ai_crypto_monitor/entry_monitor.py scan --root "$GITHUB_WORKSPACE" --send

      - name: Save dedup state after Telegram accepted an alert
        if: ${{ always() && steps.live.outputs.alert_sent == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ai_crypto_monitor/state/dedup.json
          key: ai-crypto-dedup-${{ github.ref_name }}-${{ github.run_id }}

      - name: Ensure every active run has a diagnostic row
        if: ${{ always() && steps.cadence.outputs.active == 'true' }}
        env:
          SCAN_STEP_OUTCOME: ${{ steps.live.outcome || steps.dry.outcome }}
          TESTS_STEP_OUTCOME: ${{ steps.tests.outcome }}
          SCAN_DIAGNOSTICS_FILE: ${{ github.workspace }}/ai_crypto_monitor/state/scan-diagnostics.jsonl
          SCAN_DIAGNOSTICS_CURRENT: ${{ github.workspace }}/ai_crypto_monitor/state/current-scan-diagnostic.jsonl
          SCAN_DIAGNOSTICS_META: ${{ github.workspace }}/ai_crypto_monitor/state/scan-diagnostics-meta.json
          SCAN_DIAGNOSTICS_SYMBOL: BTC-USDT-SWAP
        run: >-
          python -m ai_crypto_monitor.scan_diagnostics ensure-error
          --log "$SCAN_DIAGNOSTICS_FILE"
          --meta "$SCAN_DIAGNOSTICS_META"
          --current "$SCAN_DIAGNOSTICS_CURRENT"
          --symbol "$SCAN_DIAGNOSTICS_SYMBOL"
          --scan-outcome "$SCAN_STEP_OUTCOME"
          --tests-outcome "$TESTS_STEP_OUTCOME"

      - name: Save cumulative scan diagnostics
        if: ${{ always() && steps.cadence.outputs.active == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ai_crypto_monitor/state/scan-diagnostics.jsonl
          key: ai-crypto-diag-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload this run diagnostic
        if: ${{ always() && steps.cadence.outputs.active == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: scan-diag-${{ github.run_id }}-${{ github.run_attempt }}
          path: ai_crypto_monitor/state/current-scan-diagnostic.jsonl
          if-no-files-found: error
          retention-days: 14

  next-tick:
    needs: monitor
    if: ${{ !cancelled() && needs.monitor.outputs.chain == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dispatch next tick (bounded retry)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEXT_WAIT_ENV: ${{ needs.monitor.outputs.next_wait_env }}
          NEXT_NOT_BEFORE: ${{ needs.monitor.outputs.next_not_before }}
          NEXT_TICKS: ${{ needs.monitor.outputs.next_ticks }}
        run: python3 scheduler/dispatch.py --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" --workflow ai-crypto-trader.yml --wait-env "$NEXT_WAIT_ENV" --not-before "$NEXT_NOT_BEFORE" --ticks "$NEXT_TICKS"
