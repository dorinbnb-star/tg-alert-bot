name: AI Crypto Trader Entry Monitor

# Dry-run only: no path in this workflow reads Telegram secrets, calls Telegram or saves dedup state.
# Primary trigger: an external cron calls workflow_dispatch every 10 minutes (see AI_CRYPTO_GITHUB_ACTIONS.md),
# because GitHub `schedule` created 1 of ~40 expected runs on 2026-09-28. The cron below is only a fallback.
on:
  workflow_dispatch:
  schedule:
    # Covers 08:00-21:55 Europe/Brussels in both CET and CEST, offset from :00 (GitHub's peak-load minute).
    # The first step applies the exact local-time gate for DST transitions.
    - cron: "5,15,25,35,45,55 6-20 * * *"

permissions:
  contents: read

concurrency:
  group: ai-crypto-trader-entry-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check Brussels scan window
        id: window
        shell: bash
        run: |
          local_hour="$(TZ=Europe/Brussels date +%H)"
          if [ "$((10#$local_hour))" -ge 8 ] && [ "$((10#$local_hour))" -lt 22 ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Scanner paused outside 08:00-22:00 Europe/Brussels."
          fi

      - name: Checkout
        if: steps.window.outputs.active == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.window.outputs.active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        if: steps.window.outputs.active == 'true'
        run: python -m unittest discover -s tests -v

      - name: Dry-run scan (OKX public candles, no Telegram, writes Step Summary)
        if: steps.window.outputs.active == 'true'
        run: python ai_crypto_monitor/entry_monitor.py scan --root "$GITHUB_WORKSPACE" --dry-run
