name: AI Crypto Trader Entry Monitor

# Dry-run only: no path in this workflow reads Telegram secrets, calls Telegram or saves dedup state.
# Cadence: each tick waits for its 10-minute slot, scans inside 08:00-22:00 Europe/Brussels and dispatches the
# next tick with the ephemeral GITHUB_TOKEN (GitHub `schedule` created 1 of ~40 expected runs on 2026-09-28).
# The crons below only seed or revive the chain.
on:
  workflow_dispatch:
    inputs:
      slot:
        description: "UTC time of this tick, set by the previous tick (empty = now)"
        required: false
        default: ""
      ticks:
        description: "Remaining chained ticks on non-default branches (bounded proof runs)"
        required: false
        default: ""
  schedule:
    - cron: "52 5,6 * * *"
    - cron: "5,15,25,35,45,55 6-20 * * *"

permissions:
  contents: read

concurrency:
  group: ai-crypto-trader-entry-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      chain: ${{ steps.cadence.outputs.chain }}
      next_slot: ${{ steps.cadence.outputs.next_slot }}
      next_ticks: ${{ steps.cadence.outputs.next_ticks }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for slot and check Brussels scan window
        id: cadence
        env:
          SLOT: ${{ inputs.slot }}
          TICKS: ${{ inputs.ticks }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
        run: python scheduler/cadence.py --slot "$SLOT" --ticks "$TICKS" --default-branch "$DEFAULT_BRANCH" --ref-name "$GITHUB_REF_NAME"

      - name: Run tests
        if: steps.cadence.outputs.active == 'true'
        run: python -m unittest discover -s tests -v

      - name: Dry-run scan (OKX public candles, no Telegram, writes Step Summary)
        if: steps.cadence.outputs.active == 'true'
        run: python ai_crypto_monitor/entry_monitor.py scan --root "$GITHUB_WORKSPACE" --dry-run

  next-tick:
    needs: monitor
    if: always() && needs.monitor.outputs.chain == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write

    steps:
      - name: Dispatch next 10-minute tick
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_SLOT: ${{ needs.monitor.outputs.next_slot }}
          NEXT_TICKS: ${{ needs.monitor.outputs.next_ticks }}
        run: gh workflow run ai-crypto-trader.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f slot="$NEXT_SLOT" -f ticks="$NEXT_TICKS"
