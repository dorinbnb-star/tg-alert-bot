name: OKX Public Candles Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: okx-public-candles-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate OKX public 1H and 15m candles
        run: python diagnostics/okx_public_candles.py
